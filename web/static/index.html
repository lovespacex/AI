<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151817">
  <title>MiniChat 25M</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
          <div class="brand-name">MiniChat</div>
          <div class="brand-version">25M · 本地模型</div>
        </div>
        <button class="sidebar-close" id="sidebarCloseButton" type="button" aria-label="关闭参数" title="关闭">×</button>
      </div>

      <button class="new-chat" id="newChatButton" type="button">
        <span aria-hidden="true">＋</span>
        <span>新对话</span>
      </button>

      <div class="sidebar-spacer"></div>

      <section class="settings" aria-labelledby="settingsTitle">
        <div class="section-title" id="settingsTitle">生成参数</div>

        <label class="setting-row" for="temperature">
          <span>温度</span>
          <output id="temperatureValue">0.70</output>
        </label>
        <input id="temperature" type="range" min="0" max="1.5" step="0.05" value="0.7">

        <label class="setting-row" for="topP">
          <span>Top P</span>
          <output id="topPValue">0.85</output>
        </label>
        <input id="topP" type="range" min="0.1" max="1" step="0.05" value="0.85">

        <label class="setting-row" for="maxTokens">
          <span>最大长度</span>
          <output id="maxTokensValue">128</output>
        </label>
        <input id="maxTokens" type="range" min="32" max="256" step="16" value="128">
      </section>

      <div class="model-status" id="modelStatus">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">正在连接</span>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="mobile-header">
        <div class="mobile-brand">MiniChat 25M</div>
        <div class="mobile-actions">
          <button class="header-action" id="mobileSettingsButton" type="button" aria-label="生成参数" title="生成参数">⚙</button>
          <button class="header-action" id="mobileNewChatButton" type="button" aria-label="新对话" title="新对话">＋</button>
        </div>
      </header>

      <div class="messages" id="messages" aria-live="polite">
        <section class="empty-state" id="emptyState">
          <div class="empty-mark" aria-hidden="true">M</div>
          <h1>MiniChat 25M</h1>
          <div class="suggestions">
            <button type="button" data-prompt="你好，请介绍一下你自己。">自我介绍</button>
            <button type="button" data-prompt="什么是工程管理软件？">解释概念</button>
            <button type="button" data-prompt="给我讲一个简短的故事。">讲个故事</button>
          </div>
        </section>
      </div>

      <div class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="messageInput" rows="1" maxlength="4000" placeholder="输入消息" aria-label="输入消息"></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="发送" title="发送">
            <span aria-hidden="true">↑</span>
          </button>
        </form>
        <div class="composer-meta">
          <span>本地运行</span>
          <span id="contextUsage">0 / 512</span>
        </div>
      </div>
    </main>
  </div>

  <div class="sidebar-scrim" id="sidebarScrim"></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
