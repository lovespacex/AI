model_config: configs/model_200m_no_ckpt.yaml
mode: pretrain
train_data: data/processed/pretrain/train.bin
val_data: data/processed/pretrain/validation.bin
output_dir: checkpoints/pretrain-200m
seed: 42
max_steps: 61000
micro_batch_size: 1
gradient_accumulation_steps: 64
learning_rate: 3.0e-4
min_learning_rate: 3.0e-5
warmup_steps: 1200
weight_decay: 0.1
grad_clip: 1.0
log_interval: 10
eval_interval: 500
eval_batches: 20
save_interval: 500
resume: auto
