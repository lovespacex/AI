model_config: configs/model_200m_no_ckpt.yaml
mode: sft
train_data: data/processed/sft
val_data: data/processed/sft-validation
output_dir: checkpoints/sft-200m
init_checkpoint: checkpoints/pretrain-200m/latest.pt
seed: 43
max_steps: 2500
micro_batch_size: 1
gradient_accumulation_steps: 32
learning_rate: 5.0e-5
min_learning_rate: 5.0e-6
warmup_steps: 100
weight_decay: 0.05
grad_clip: 1.0
log_interval: 5
eval_interval: 100
eval_batches: 20
save_interval: 100
resume: auto
